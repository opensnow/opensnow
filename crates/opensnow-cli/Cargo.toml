[package]
name = "opensnow-cli"
description = "SnowSQL-compatible command-line client for OpenSnow. Supports interactive REPL, batch file execution, and variable templating."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "opensnow"
path = "src/main.rs"

[dependencies]
opensnow-common = { path = "../opensnow-common" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# TODO: add when implementation begins
# clap = { version = "...", features = ["derive"] }   ← argument parsing
# rustyline = "..."                                    ← readline/REPL
# tokio-postgres = "..."                               ← PostgreSQL wire client
# reqwest = { version = "...", features = ["json"] }  ← Snowflake REST API v2 client
# comfy-table = "..."                                  ← TABLE output format
