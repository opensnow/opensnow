[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/charts/*"
  [headers.values]
    Content-Type = "application/x-gzip"

[[headers]]
  for = "/charts/opensnow/*"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/charts/index.yaml"
  [headers.values]
    Content-Type = "application/x-yaml"

[[redirects]]
  from = "/api/helm/*"
  to = "/charts/:splat"
  status = 200

[[redirects]]
  from = "/charts"
  to = "/charts/"
  status = 301
