name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:

  # ---------------------------------------------------------------------------
  # Build and push container images to GitHub Container Registry (GHCR)
  # Produces:
  #   ghcr.io/opensnow/opensnow-server:<tag>
  #   ghcr.io/opensnow/opensnow-worker:<tag>
  # ---------------------------------------------------------------------------
  build-and-push-images:
    name: Build & push container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push opensnow-server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            ghcr.io/opensnow/opensnow-server:${{ steps.version.outputs.tag }}
            ghcr.io/opensnow/opensnow-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push opensnow-worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ghcr.io/opensnow/opensnow-worker:${{ steps.version.outputs.tag }}
            ghcr.io/opensnow/opensnow-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Build and upload CLI binaries for macOS, Linux, and Windows
  # Attached as assets to the GitHub Release.
  # ---------------------------------------------------------------------------
  release-cli:
    name: Release CLI binaries
    runs-on: ubuntu-latest
    needs: build-and-push-images
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI binary
        run: cargo build --release --bin opensnow --target ${{ matrix.target }}

      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/${{ matrix.target }}/release/opensnow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Create the GitHub Release with release notes
  # ---------------------------------------------------------------------------
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push-images, release-cli]
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
