name: Release

# Triggered by a version tag push: git tag v0.2.0 && git push --tags
on:
  push:
    tags:
      - "v*.*.*"

jobs:

  # ---------------------------------------------------------------------------
  # Build and push container images to GitHub Container Registry (GHCR)
  # Produces:
  #   ghcr.io/opensnow/opensnow-server:<tag>
  #   ghcr.io/opensnow/opensnow-worker:<tag>
  # ---------------------------------------------------------------------------
  build-and-push-images:
    name: Build & push container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # TODO: uncomment once Dockerfile.server produces a working binary
      # - name: Build and push opensnow-server
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: Dockerfile.server
      #     push: true
      #     tags: |
      #       ghcr.io/opensnow/opensnow-server:${{ steps.version.outputs.tag }}
      #       ghcr.io/opensnow/opensnow-server:latest
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

      # TODO: uncomment once Dockerfile.worker produces a working binary
      # - name: Build and push opensnow-worker
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: Dockerfile.worker
      #     push: true
      #     tags: |
      #       ghcr.io/opensnow/opensnow-worker:${{ steps.version.outputs.tag }}
      #       ghcr.io/opensnow/opensnow-worker:latest
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

      - name: Placeholder — images not yet built
        run: echo "Image build skipped — binaries not yet implemented. Remove this step once Dockerfiles are enabled."

  # ---------------------------------------------------------------------------
  # Deploy documentation site and Helm chart to Netlify
  # The chart is served at https://charts.opensnow.io (via Netlify redirect)
  # ---------------------------------------------------------------------------
  deploy-netlify:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: build-and-push-images
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Extract version tag (strip leading 'v')
        id: version
        run: echo "chart_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      - name: Package Helm chart
        run: |
          helm package deploy/helm --version ${{ steps.version.outputs.chart_version }} --destination site/dist/charts/
          mkdir -p site/dist/charts/opensnow
          tar -xzf site/dist/charts/opensnow-${{ steps.version.outputs.chart_version }}.tgz -C site/dist/charts/opensnow --strip-components=1
          helm repo index site/dist/charts --url https://charts.opensnow.io/charts
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Update Chart.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.chart_version }}/" deploy/helm/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${GITHUB_REF_NAME}\"/" deploy/helm/Chart.yaml

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: site/dist
          production-branch: main
          production-deploy: true
          deploy-message: "Deploy from GitHub Actions - ${{ github.ref_name }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout: 300000

  # ---------------------------------------------------------------------------
  # Build and upload CLI binaries for macOS, Linux, and Windows
  # Attached as assets to the GitHub Release.
  # ---------------------------------------------------------------------------
  release-cli:
    name: Release CLI binaries
    runs-on: ubuntu-latest
    needs: build-and-push-images
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          # TODO: add Windows target once cross-compilation is set up
          # - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

