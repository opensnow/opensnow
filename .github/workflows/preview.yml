name: Deploy Preview

on:
  pull_request:
    branches: [main]

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      - name: Package Helm chart
        run: |
          helm package deploy/helm --version 0.1.0 --destination site/dist/charts/
          mkdir -p site/dist/charts/opensnow
          tar -xzf site/dist/charts/opensnow-0.1.0.tgz -C site/dist/charts/opensnow --strip-components=1
          helm repo index site/dist/charts --url https://charts.opensnow.io/charts

      - name: Deploy preview to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: site/dist
          production-deploy: false
          deploy-message: "Preview - PR #${{ github.event.pull_request.number }}"
          enable-pull-request-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout: 300000
